[project]
name = "ioc-analyzer"
version = "1.2.0"
description = "Secure log and indicator-of-compromise analyzer (Cyber Operations Project 1)"
requires-python = ">=3.10"
dependencies = []  # Runtime uses the Python standard library only.
# Development tools are pinned in requirements-dev.txt.

# Pylint uses its default rules; the only setting tells it where the module
# lives so the test suite can import it.
[tool.pylint.main]
source-roots = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
branch = true
source = ["obinna_project1"]

[tool.coverage.report]
show_missing = true
fail_under = 90
